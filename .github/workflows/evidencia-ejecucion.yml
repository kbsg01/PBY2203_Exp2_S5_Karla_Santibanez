name: Evidencia de ejecución BFF (Banco XYZ)

# Compila los 4 módulos, levanta los 4 servicios reales (core-service en HTTP interno,
# los 3 BFF en HTTPS con su certificado autofirmado de demostración académica) y ejecuta
# scripts/probar_apis.sh contra ellos. Publica los logs como evidencia de ejecución real,
# tal como exige la pauta de evaluación sumativa de la Semana 5 (criterio "Entrega los
# aspectos claves solicitados en el caso").

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  evidencia:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Instalar jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Compilar los 4 módulos (Maven)
        run: mvn -B -DskipTests package | tee evidencias/evidencia01-build.log

      - name: Levantar core-service (:8080, HTTP interno)
        run: |
          nohup java -jar core-service/target/core-service.jar \
            > evidencias/evidencia02-core-service.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null -H "X-Internal-Api-Key: clave-interna-banco-xyz-2026" \
              http://localhost:8080/internal/cuentas && break
            sleep 1
          done

      - name: Levantar bff-web (:8081, HTTPS)
        run: |
          nohup java -jar bff-web/target/bff-web.jar \
            > evidencias/evidencia03-bff-web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sk -o /dev/null https://localhost:8081/api/web/auth/login && break
            sleep 1
          done

      - name: Levantar bff-mobile (:8082, HTTPS)
        run: |
          nohup java -jar bff-mobile/target/bff-mobile.jar \
            > evidencias/evidencia04-bff-mobile.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sk -o /dev/null https://localhost:8082/api/mobile/auth/login && break
            sleep 1
          done

      - name: Levantar bff-atm (:8083, HTTPS)
        run: |
          nohup java -jar bff-atm/target/bff-atm.jar \
            > evidencias/evidencia05-bff-atm.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sk -o /dev/null https://localhost:8083/api/atm/sesion && break
            sleep 1
          done

      - name: Ejecutar pruebas end-to-end (scripts/probar_apis.sh)
        run: bash scripts/probar_apis.sh | tee evidencias/evidencia06-pruebas-apis.log

      - name: Publicar evidencia como artefacto descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-ejecucion-bff
          path: evidencias/*.log
          retention-days: 90
